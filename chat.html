<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BruceClaw Direct</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
.header{background:#1a1a1a;padding:15px;border-bottom:2px solid #ff6600;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#ff6600;margin:0;font-size:18px}
.status{color:#00cc66;font-size:14px}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 15px;border-radius:15px;font-size:14px;line-height:1.4}
.user{align-self:flex-end;background:#ff6600;color:#fff}
.bot{align-self:flex-start;background:#2a2a2a;color:#fff}
.tools{color:#888;font-size:12px;margin-top:5px;font-style:italic}
.input{display:flex;gap:10px;padding:10px;background:#1a1a1a;border-top:2px solid #ff6600}
input{flex:1;padding:12px;border:1px solid #444;border-radius:25px;background:#222;color:#fff;font-size:14px;outline:none}
button{padding:12px 20px;background:#ff6600;color:#fff;border:none;border-radius:25px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<h1>BruceClaw Direct</h1>
<div class="status" id="status">Connecting...</div>
</div>
<div class="messages" id="messages"></div>
<div class="input">
<input id="input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">SEND</button>
</div>
<script>
const BRIDGE='http://localhost:9999';
const msg=document.getElementById('messages');
const stat=document.getElementById('status');
function addMsg(text,cls){
const d=document.createElement('div');
d.className='msg '+cls;
d.textContent=text;
msg.appendChild(d);
msg.scrollTop=msg.scrollHeight;
}
async function send(){
const input=document.getElementById('input');
const text=input.value.trim();
if(!text)return;
input.value='';
addMsg(text,'user');
try{
const r=await fetch(BRIDGE+'/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({model:'mimo-v2.5',messages:[{role:'user',content:text}],max_tokens:300})
});
const d=await r.json();
const reply=d.choices?.[0]?.message?.content||'No response';
addMsg(reply,'bot');
}catch(e){
addMsg('Error: '+e.message,'bot');
}
}
async function checkBridge(){
try{
const r=await fetch(BRIDGE+'/');
const d=await r.json();
stat.textContent='Connected ('+d.tools?.length+' tools)';
stat.style.color='#00cc66';
}catch(e){
stat.textContent='Bridge offline';
stat.style.color='#ff3333';
}
}
checkBridge();
setInterval(checkBridge,10000);
addMsg('Hey! What can I do for you?','bot');
</script>
</body>
</html>
